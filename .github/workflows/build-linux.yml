name: AyuGram Linux

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "changelog.txt"
      - "LEGAL"
      - "LICENSE"

concurrency:
  group: ayugram-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 Release
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/telegramdesktop/tdesktop/centos_env:latest
      CCACHE_DIR: "${{ github.workspace }}/.ccache"

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout AyuGram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # BUILD IMAGE
      # ============================================================

      - name: Pull build environment
        id: image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "$IMAGE" \
            | sha256sum \
            | cut -c1-16
          )"

          echo "key=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Docker environment key: $DIGEST"

      # ============================================================
      # SUBMODULE FINGERPRINT
      #
      # Если AyuGram обновил lib_ui/codegen/lib_tl/etc,
      # старый out лучше не использовать.
      # ============================================================

      - name: Calculate submodule fingerprint
        id: submodules
        shell: bash
        run: |
          set -euo pipefail

          HASH="$(
            git submodule status --recursive \
            | sha256sum \
            | cut -c1-16
          )"

          echo "key=$HASH" >> "$GITHUB_OUTPUT"
          echo "Submodules key: $HASH"

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}

          key: >-
            ayugram-ccache-${{
              runner.os
            }}-${{
              steps.image.outputs.key
            }}-${{
              github.run_id
            }}

          restore-keys: |
            ayugram-ccache-${{ runner.os }}-${{ steps.image.outputs.key }}-

      # ============================================================
      # CMAKE / OBJECT CACHE
      #
      # Меняем namespace кеша при:
      # - обновлении Docker toolchain;
      # - обновлении submodules;
      # - изменении структуры CMake.
      #
      # Обычные изменения .cpp/.h кеш НЕ инвалидируют.
      # ============================================================

      - name: Restore incremental build
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: out

          key: >-
            ayugram-out-${{
              runner.os
            }}-${{
              steps.image.outputs.key
            }}-${{
              steps.submodules.outputs.key
            }}-${{
              hashFiles(
                '**/CMakeLists.txt',
                '**/*.cmake',
                'Telegram/configure.py',
                'Telegram/configure.sh'
              )
            }}-${{
              github.run_id
            }}

          restore-keys: |
            ayugram-out-${{ runner.os }}-${{ steps.image.outputs.key }}-${{ steps.submodules.outputs.key }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'Telegram/configure.py', 'Telegram/configure.sh') }}-

      # ============================================================
      # FIX MTIMES FOR NINJA
      #
      # Без этого GitHub checkout делает исходники "новее"
      # восстановленных object files.
      # ============================================================

      - name: Prepare incremental build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f out/.ci-cache-base-sha ]; then
            echo "No previous incremental build found."
            exit 0
          fi

          BASE_SHA="$(cat out/.ci-cache-base-sha)"

          echo "Cached commit: $BASE_SHA"
          echo "Current commit: $GITHUB_SHA"

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Cached commit is unavailable."
            echo "Dropping out cache."
            rm -rf out
            exit 0
          fi

          if ! git merge-base --is-ancestor \
            "$BASE_SHA" "$GITHUB_SHA"
          then
            echo "History diverged / branch was rebased."
            echo "Dropping out cache."
            rm -rf out
            exit 0
          fi

          echo "Reusing previous CMake/Ninja build."

          #
          # Делаем сохранённые build outputs новее checkout-файлов.
          #
          find out -type f -exec touch {} +

          #
          # Затем реальные изменённые исходники делаем ещё новее.
          #
          sleep 1

          echo "Changed files since cached build:"

          git diff \
            --name-only \
            --diff-filter=ACMRTUXB \
            "$BASE_SHA" \
            "$GITHUB_SHA"

          git diff \
            --name-only \
            --diff-filter=ACMRTUXB \
            -z \
            "$BASE_SHA" \
            "$GITHUB_SHA" \
          | while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                touch "$file"
              fi
            done

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build AyuGram
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$CCACHE_DIR:/var/cache/ccache" \
            -e CONFIG=Release \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE" \
            env -u CCACHE_DISABLE \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D TDESKTOP_API_ID="$API_ID" \
              -D TDESKTOP_API_HASH="$API_HASH"

      # ============================================================
      # CHECK
      # ============================================================

      - name: Check build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f out/Release/Telegram ]; then
            echo "ERROR: out/Release/Telegram not found"
            exit 1
          fi

          echo
          echo "Build successful:"
          file out/Release/Telegram
          ls -lh out/Release/Telegram

      # ============================================================
      # SAVE CURRENT COMMIT INTO OUT CACHE
      # ============================================================

      - name: Mark incremental build revision
        shell: bash
        run: |
          echo "$GITHUB_SHA" > out/.ci-cache-base-sha

      # ============================================================
      # SAVE CCACHE
      # ============================================================

      - name: Save ccache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}

          key: >-
            ayugram-ccache-${{
              runner.os
            }}-${{
              steps.image.outputs.key
            }}-${{
              github.run_id
            }}

      # ============================================================
      # SAVE OUT
      # ============================================================

      - name: Save incremental build
        if: success()
        uses: actions/cache/save@v4
        with:
          path: out

          key: >-
            ayugram-out-${{
              runner.os
            }}-${{
              steps.image.outputs.key
            }}-${{
              steps.submodules.outputs.key
            }}-${{
              hashFiles(
                '**/CMakeLists.txt',
                '**/*.cmake',
                'Telegram/configure.py',
                'Telegram/configure.sh'
              )
            }}-${{
              github.run_id
            }}

      # ============================================================
      # PACKAGE
      #
      # tar.gz сохраняет executable bit.
      # ============================================================

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package
          mkdir package

          cp out/Release/Telegram package/AyuGram
          chmod +x package/AyuGram

          tar \
            -C package \
            -czf AyuGram-Linux-x86_64.tar.gz \
            AyuGram

          ls -lh AyuGram-Linux-x86_64.tar.gz

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-x86_64
          path: AyuGram-Linux-x86_64.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error